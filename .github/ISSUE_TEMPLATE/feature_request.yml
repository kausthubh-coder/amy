name: Feature request
description: Suggest something that would make logging faster or more trustworthy.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the moment in your day where Amy gets in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
  - type: markdown
    attributes:
      value: Amy intentionally avoids water tracking, menu scanning, accounts, and extra nutrition databases. See PRODUCT.md.
